<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Web Page</title>
</head>
<body>

    <!-- Main Heading -->
    <h1>Welcome to My Website</h1>

    <!-- A simple paragraph with text formatting -->
    <p>This is a basic paragraph of text. HTML allows you to make text <strong>bold</strong> or <em>italicized</em> very easily.</p>

    <!-- An example of a hyperlink -->
    <p>You can visit the official site at <a href="https://www.w3schools.com" target="_blank">W3Schools</a> for more tutorials.</p>

    <!-- An example of an unordered list -->
    <h2>My Favorite Fruits</h2>
    <ul>
        <li>Apples</li>
        <li>Bananas</li>
        <li>Oranges</li>
        <li>Guvavas</li>
    </ul>

    <!-- An image placeholder (Replace 'image.jpg' with your actual file path) -->
    <h2>Sample Image</h2>
    <img src="https://placeholder.com" alt="A simple placeholder image" width="150" height="150">

</body>
</html>
